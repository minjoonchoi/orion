endpoints:
  - id: search
    name: \uC9C1\uC6D0 \uAC80\uC0C9
    method: POST
    path: /employees/search
    request:
      fields:
        keyword:
          { location: body, path: /keyword, type: string, privacy: false }
        region_codes:
          location: body
          path: /filter/region_codes
          type: array
          items: { type: string }
          required: true
          privacy: false
        requester_email:
          location: body
          path: /requester_email
          type: string
          required: false
          privacy: true
          masking: email
        internal_option:
          {
            location: body,
            path: /internal_option,
            type: boolean,
            privacy: false,
          }
    response:
      fields:
        employee_name:
          {
            path: /items/*/employee_name,
            type: string,
            privacy: true,
            masking: name,
          }
        email_address:
          {
            path: /items/*/email_address,
            type: string,
            privacy: true,
            masking: email,
          }
        region_code:
          { path: /items/*/region_code, type: string, privacy: false }
        internal_note:
          {
            path: /items/*/internal_note,
            type: string,
            privacy: true,
            masking: redact,
          }

    - id: policy-platform
      state: present
      version: 2026.09.24
      name: Platform operator access
      description: Allow platform operators to manage Orion roles, policies, users and organizations.
      effect: allow
      resources:
        - kind: services
          id: svc-orion
        - kind: service-endpoints
          id: ep-roles
        - kind: pages
          id: page-users
      processors:
        pre:
          - endpointId: ep-roles
            target: request.query
            handler: request.set-fields
            mode: required
            config:
              fields:
                tenantId: { source: identity.claims.tenant_id }
          - endpointId: ep-roles
            target: request.body
            handler: request.set-fields
            mode: required
            config:
              fields:
                updatedBy: { source: identity.subject }
        post:
          - endpointId: ep-roles
            target: response.body
            handler: response.remove-fields
            mode: required
            config:
              fields: ["/internalNotes"]
    - id: policy-directory
      state: present
      version: 2026.09.24
      name: Directory read access
      description: Allow directory readers to inspect user directory pages and APIs.
      effect: allow
      resources:
        - kind: pages
          id: page-users
        - kind: service-endpoints
          id: ep-users
      processors:
        pre:
          - endpointId: ep-users
            target: request.query
            handler: request.set-fields
            mode: required
            config:
              fields:
                department: { source: identity.claims.department }
        post:
          - endpointId: ep-users
            target: response.body
            handler: response.remove-fields
            mode: required
            config:
              fields:
                - /items/*/employeeNumber
                - /items/*/personalEmail
    - id: policy-unassigned
      state: absent
      version: 2026.09.24
      name: Retired sample policy
      description: Explicit deletion of an unused sample policy.
      effect: deny
      resources: []
      processors:
        pre: []
        post: []
