apiVersion: orion.io/v1alpha1
kind: ResourceBundle
metadata:
  name: orion-backoffice
  environment: development
  region: ap-northeast-2
spec:
  # Entries are full definitions. Omitted IDs are retained, never implicitly pruned.
  resources:
    - id: ws-platform
      kind: workspaces
      state: present
      name: Platform Operations
      description: Internal administration workspace
      path: ""
      method: ""
      parentId: ""
    - id: page-users
      kind: pages
      state: present
      name: User Directory
      description: User administration page
      path: /directory/users
      method: ""
      parentId: ws-platform
    - id: svc-orion
      kind: services
      state: present
      name: Orion Identity API
      description: Central identity and authorization API
      path: ""
      method: ""
      parentId: ""
    - id: ep-users-list
      kind: service-endpoints
      state: present
      name: List users
      description: Read the user directory
      path: /v2/users
      method: GET
      parentId: svc-orion
    # Example explicit deletion of an unused workspace.
    - id: ws-empty
      kind: workspaces
      state: absent
      name: Unused workspace
      description: Decommission unused workspace
      path: ""
      method: ""
      parentId: ""
